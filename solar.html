<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VS SolarOne · Solar Dashboard</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0d5c46">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VS Solar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f3f4f1; --surface:#fcfcfb; --line:#e3e2dd; --grid:#ecebe7;
  --ink:#0b0b0b; --ink2:#52514e; --ink3:#8a8984;
  --brand:#0d5c46; --brand2:#e6f2ec;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --warn:#b45309; --warnbg:#fff4e0; --crit:#c62828; --critbg:#fdecec;
  --peach:#fcd9bd; --peach2:#fff1e6;
  --r:12px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 'Noto Sans Lao','Phetsarath OT',system-ui,-apple-system,'Segoe UI',sans-serif;}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
.top .sub{font-size:12px;opacity:.8}
.badge{font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.16);white-space:nowrap}
.badge.staff{background:#ffd27a;color:#4a3000}
.spacer{flex:1}
.top select,.top button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
.top select option{color:#000}
.top button:hover{background:rgba(255,255,255,.22)}
main{max-width:1440px;margin:0 auto;padding:16px 18px 40px}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .l{font-size:12.5px;color:var(--ink2)}
.kpi .v{font-size:26px;font-weight:700;margin-top:2px;line-height:1.2}
.kpi .v small{font-size:13px;font-weight:500;color:var(--ink2);margin-left:4px}
.kpi .s{font-size:12px;color:var(--ink3);margin-top:2px}
/* layout */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 2px;font-weight:700}
.card .hint{font-size:12px;color:var(--ink3);margin:0 0 8px}
.cardhead{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:4px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend .ref i{height:0;border-top:2px dashed var(--ink3);border-radius:0;width:16px;vertical-align:3px}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.tip{position:fixed;pointer-events:none;background:#1b1b1a;color:#f4f3ef;font-size:12.5px;padding:8px 10px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:60;display:none;max-width:260px}
.tip b{font-weight:600}
.tip .row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
/* project cards */
.proj{display:flex;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;cursor:pointer;background:#fff;transition:border-color .15s}
.proj:hover{border-color:var(--ink3)}
.proj.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand2)}
.proj img{width:112px;height:84px;object-fit:cover;border-radius:8px;flex:none}
.proj .nm{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.proj .nm i{width:10px;height:10px;border-radius:3px;display:inline-block}
.proj .meta{font-size:12px;color:var(--ink2);line-height:1.5}
.proj .meta b{color:var(--ink);font-weight:600}
/* events */
.evsum{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:2px 9px;background:#fff;color:var(--ink2)}
.ev{border-left:3px solid var(--warn);background:var(--warnbg);border-radius:6px;padding:7px 10px;margin-bottom:7px;font-size:13px}
.ev.crit{border-left-color:var(--crit);background:var(--critbg)}
.ev .h{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink2)}
.ev .h b{color:var(--ink)}
.ev .n{margin-top:2px}
.ev .k{font-size:11.5px;color:var(--ink2);margin-top:2px}
.evlist{max-height:430px;overflow:auto;padding-right:2px}
.empty{color:var(--ink3);font-size:13px;padding:10px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:5px 11px;cursor:pointer;font-size:13px;color:var(--ink2)}
.seg button.on{background:var(--brand);color:#fff}
/* table (PDF format) */
.tblwrap{overflow:auto}
table.gen{border-collapse:collapse;width:100%;min-width:760px;font-size:13px;background:#fff}
table.gen th,table.gen td{border:1px solid #2b2b2b;padding:3px 8px}
table.gen thead th{background:var(--peach);font-weight:700;white-space:nowrap;text-align:center}
table.gen td.c{text-align:center}
table.gen td.r{text-align:right}
table.gen tbody tr:nth-child(even){background:#fbfbfa}
table.gen tbody tr.has-note td.note{color:var(--crit)}
table.gen tfoot td{background:var(--peach);font-weight:700;border-top:2px solid #2b2b2b}
table.gen tfoot td.u{text-decoration:underline}
table.gen .act{width:1%;white-space:nowrap;text-align:center;border-color:#ddd}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.btn.dang{color:var(--crit);border-color:#f0c4c4}
.btn.sm{padding:2px 8px;font-size:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 10px}
.toolbar select{border:1px solid var(--line);border-radius:8px;padding:5px 9px;background:#fff}
.staffonly{display:none}
body.is-staff .staffonly{display:revert}
/* gate + modal */
.overlay{position:fixed;inset:0;background:rgba(10,30,24,.55);display:flex;align-items:center;justify-content:center;z-index:80;padding:16px}
.overlay[hidden]{display:none}
.box{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.box h3{margin:0 0 4px;font-size:18px}
.box p{margin:0 0 14px;color:var(--ink2);font-size:13px}
.gatebtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gatebtn{border:1px solid var(--line);border-radius:12px;padding:16px 10px;background:#fafaf8;cursor:pointer;text-align:center}
.gatebtn:hover{border-color:var(--brand);background:var(--brand2)}
.gatebtn .ic{font-size:28px}
.gatebtn b{display:block;margin-top:4px}
.gatebtn span{font-size:12px;color:var(--ink2)}
.f{margin-bottom:10px}
.f label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;border:1px solid #cfcec8;border-radius:8px;padding:8px 10px;background:#fff}
.f textarea{min-height:60px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--crit);font-size:12.5px;min-height:18px}
.calc{font-size:12.5px;color:var(--ink2);background:#f6f6f3;border-radius:8px;padding:7px 10px;margin-bottom:10px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1b1b1a;color:#fff;padding:9px 16px;border-radius:10px;z-index:90;font-size:13px;display:none}
.loading{opacity:.55;pointer-events:none}
@media (max-width:1060px){.grid{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:14px}.side .card{margin-bottom:0}}
@media (max-width:720px){.kpis{grid-template-columns:1fr 1fr}.side{display:block}.side .card{margin-bottom:14px}.kpi .v{font-size:21px}main{padding:12px}.top{padding:10px 12px}}
@media print{
  .top,.kpis,.grid,.toolbar,.staffonly,.noprint{display:none!important}
  body{background:#fff}
  main{padding:0}
  #tableCard{border:0;padding:0}
  table.gen{min-width:0;font-size:11px}
  .printtitle{display:block!important}
}
.printtitle{display:none;font-weight:700;margin-bottom:6px}
.brand{background:#fff;border-bottom:3px solid #f5c400;display:flex;align-items:center;gap:16px;padding:8px 18px;flex-wrap:wrap}
.brand img{display:block;height:46px;width:auto}
.brand img.vs{height:54px}
.brand .sep{width:1px;height:40px;background:var(--line)}
.brand .bt{margin-left:auto;text-align:right}
.brand .bt b{display:block;font-size:17px;color:var(--brand)}
.brand .bt span{font-size:12px;color:var(--ink2)}
.gatelogos{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px}
.gatelogos img{height:40px;width:auto}.gatelogos img.vs{height:56px}
table.list{border-collapse:collapse;width:100%;min-width:820px;font-size:13px}
table.list th{position:sticky;top:0;background:#f1f0ec;text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list td{padding:5px 8px;border-bottom:1px solid var(--grid)}
table.list td.r,table.list th.r{text-align:right}
table.list tr:hover td{background:#f7f9f6}
.listwrap{max-height:480px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.toolbar input[type=search]{border:1px solid var(--line);border-radius:8px;padding:5px 9px;background:#fff;min-width:180px}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
body.is-staff table.gen tbody tr{cursor:pointer}
.edinfo{font-size:12.5px;border-radius:8px;padding:6px 10px;margin-bottom:10px;background:#eef5ff;color:#1d4f8f}
.edinfo:empty{display:none}
@media (max-width:720px){.brand{padding:8px 12px;gap:10px}.brand img{height:30px}.brand img.vs{height:40px}.brand .bt{display:none}}
@media print{.brand{display:flex!important;border:0;padding:0 0 8px}.brand .bt{display:block}}
</style>
<style>
.langseg{display:inline-flex;border:1px solid rgba(255,255,255,.35);border-radius:8px;overflow:hidden}
.langseg button{border:0;border-radius:0;background:transparent;color:#fff;padding:6px 10px;cursor:pointer}
.langseg button.on{background:#fff;color:var(--brand);font-weight:700}
table.plan{border-collapse:collapse;width:100%;font-size:14px;background:#fff;min-width:560px}
table.plan th,table.plan td{border:1px solid #2b2b2b;padding:4px 10px}
table.plan thead th{background:#fff;font-weight:700;text-align:center;font-size:15px}
table.plan thead tr.ttl th{font-size:17px;border:0;padding-bottom:6px}
table.plan td{text-align:center}
table.plan td.m{font-weight:700;text-align:center}
table.plan tr.h2row td{background:#fff3d6}
table.plan tr.sub td{background:#eef4f1;font-weight:700}
table.plan tr.tot td{background:#fcd9bd;font-weight:700}
table.plan td.good{color:#1a7f37;font-weight:600}
table.plan td.bad{color:var(--crit);font-weight:600}
table.plan input{width:90px;text-align:center;border:1px solid #cfcec8;border-radius:6px;padding:3px}
.srcTag{font-size:10px;color:var(--ink3);margin-left:4px;vertical-align:super}
.planGrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.pchips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 10px}
.pchip{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.pchip .l{font-size:12px;color:var(--ink2)}
.pchip .v{font-size:19px;font-weight:700}
.pchip .s{font-size:11.5px;color:var(--ink3)}
#sharedInfo{display:flex;gap:8px;align-items:flex-start;background:#eef5ff;border:1px solid #cfe0f7;color:#1d4f8f;border-radius:10px;padding:8px 12px;font-size:12.5px;margin:-4px 0 14px}
#sharedInfo[hidden]{display:none}
.shtag{display:inline-block;font-size:10.5px;font-weight:600;background:#eef5ff;color:#1d4f8f;border-radius:99px;padding:1px 7px;margin-left:4px;vertical-align:1px}
.tblnote{font-size:12px;color:#1d4f8f;background:#eef5ff;border-radius:8px;padding:6px 10px;margin-top:8px}
.tblnote:empty{display:none}
#shBox{background:#f6f9fd;border:1px solid #dbe6f5;border-radius:8px;padding:8px 10px;margin-bottom:10px}
#shBox[hidden],#noteSingle[hidden],#shNotes[hidden]{display:none}
#shBox label{font-size:13px;margin-right:14px}
.pnote{font-size:12px;color:var(--ink2);background:#f6f6f3;border-radius:8px;padding:7px 10px;margin-top:8px}
@media (max-width:1060px){.planGrid{grid-template-columns:1fr}}
@media (max-width:720px){.pchips{grid-template-columns:1fr 1fr}}
</style>
</head>

var REMOTE=/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(API_URL);
function call(method,body){
  var url=API_URL+(method==='GET'?'?action=all&t='+Date.now():'');
  var opt=method==='GET'?{method:'GET'}:{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)};
  return fetch(url,opt).then(function(r){if(!r.ok)throw 'HTTP '+r.status;return r.json();}).then(function(j){if(!j.ok)throw (j.error||'error');return j;});
}
function lsGet(k){try{var s=localStorage.getItem(k);return s?JSON.parse(s):null;}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var mem=null;
function local(){if(!mem){mem={records:lsGet('solarGen.v1')||JSON.parse($('seed').textContent),plans:lsGet('solarPlan.v1')||JSON.parse($('seedPlans').textContent)};autoPlanLocal();}return mem;}
function persist(){lsSet('solarGen.v1',mem.records);lsSet('solarPlan.v1',mem.plans);}
function autoPlanLocal(){var d=new Date();if(d.getMonth()===10){var Y=d.getFullYear()+1;if(!mem.plans.some(function(p){return p.y===Y;})){mem.plans=mem.plans.concat(computePlans(Y,mem.records,mem.plans));persist();}}}
var API={
  load:function(){ if(REMOTE) return call('GET').then(function(j){return {records:j.records,plans:j.plans||[]};}); var m=local();return Promise.resolve({records:m.records.slice(),plans:m.plans.slice()}); },
  checkPw:function(pw){ if(REMOTE) return call('POST',{action:'check',pw:pw}).then(function(j){return !!j.valid;}); return Promise.resolve(pw===LOCAL_PW); },
  save:function(pw,rec){ if(REMOTE) return call('POST',{action:'save',pw:pw,rec:rec}); if(pw!==LOCAL_PW)return Promise.reject(t('wrongPw'));
    mem.records=mem.records.filter(function(r){return !(r.p===rec.p&&r.d===rec.d);});mem.records.push(rec);persist();return Promise.resolve(true);},
  del:function(pw,p,d){ if(REMOTE) return call('POST',{action:'delete',pw:pw,p:p,d:d}); if(pw!==LOCAL_PW)return Promise.reject(t('wrongPw'));
    mem.records=mem.records.filter(function(r){return !(r.p===p&&r.d===d);});persist();return Promise.resolve(true);},
  saveShared:function(pw,o){ if(REMOTE) return call('POST',{action:'saveShared',pw:pw,data:o}); if(pw!==LOCAL_PW)return Promise.reject(t('wrongPw'));
    var recs=sharedRecords(o);mem.records=mem.records.filter(function(r){return !(SHARED.indexOf(r.p)>=0&&r.d===o.d);}).concat(recs);persist();return Promise.resolve(true);},
  delShared:function(pw,d){ if(REMOTE) return call('POST',{action:'deleteShared',pw:pw,d:d}); if(pw!==LOCAL_PW)return Promise.reject(t('wrongPw'));
    mem.records=mem.records.filter(function(r){return !(SHARED.indexOf(r.p)>=0&&r.d===d);});persist();return Promise.resolve(true);},
  savePlan:function(pw,y,p,v){ if(REMOTE) return call('POST',{action:'savePlan',pw:pw,y:y,p:p,v:v}); if(pw!==LOCAL_PW)return Promise.reject(t('wrongPw'));
    var old=mem.plans.filter(function(x){return x.y===y&&x.p===p;})[0];
    var s=v.map(function(x,i){return old&&old.v[i]===x?old.s[i]:'manual';});
    mem.plans=mem.plans.filter(function(x){return !(x.y===y&&x.p===p);});mem.plans.push({y:y,p:p,v:v,s:s});persist();return Promise.resolve(true);},
  genPlan:function(pw,y){ if(REMOTE) return call('POST',{action:'genPlan',pw:pw,y:y}); if(pw!==LOCAL_PW)return Promise.reject(t('wrongPw'));
    var np=computePlans(y,mem.records,mem.plans);mem.plans=mem.plans.filter(function(x){return x.y!==y;}).concat(np);persist();return Promise.resolve(true);}
};
/* Shared meter: split total by installed capacity of the plants that were generating (same rule as Code.gs) */
function splitShared(total,on){
  var ids=SHARED.filter(function(id){return on[id];}),cap=0;ids.forEach(function(id){cap+=PMAP[id].mw;});
  var out={},left=total;SHARED.forEach(function(id){out[id]=0;});
  ids.forEach(function(id,i){var v=i===ids.length-1?left:Math.round(total*PMAP[id].mw/cap*100)/100;out[id]=Math.round(v*100)/100;left-=out[id];});
  return out;
}
function sharedRecords(o){
  var sp=splitShared(+o.total||0,o.on),recs=[];
  SHARED.forEach(function(id){var note=String((o.notes||{})[id]||'').trim();
    if(sp[id]>0||note)recs.push({p:id,d:o.d,kwh:sp[id],irr:o.irr==null?null:+o.irr,note:note,rate:+o.rate||DEFAULT_RATE,m:+o.total||0});});
  return recs;
}
/* Next-year plan = average of actual monthly generation of all past years.
   Uses only months finished before 1 Nov of the previous year; a partly recorded month (≥7 days) is scaled to a full month;
   months without actual data carry over the latest earlier plan. (Same rule as Code.gs) */
function computePlans(Y,records,plans){
  return PROJECTS.map(function(P){
    var prev=plans.filter(function(x){return x.p===P.id&&x.y<Y;}).sort(function(a,b){return b.y-a.y;})[0];
    var v=[],s=[];
    for(var m=1;m<=12;m++){
      var vals=[];
      for(var y=2000;y<Y;y++){
        if(y===Y-1&&m>10)continue;
        var key=y+'-'+('0'+m).slice(-2),rs=records.filter(function(r){return r.p===P.id&&String(r.d).slice(0,7)===key;});
        if(rs.length<7)continue;
        var dim=new Date(y,m,0).getDate(),tot=0;rs.forEach(function(r){tot+=+r.kwh||0;});
        vals.push(rs.length>=dim?tot:tot/rs.length*dim);
      }
      if(vals.length){var a=0;vals.forEach(function(x){a+=x;});v.push(Math.round(a/vals.length));s.push('avg');}
      else{v.push(prev?prev.v[m-1]:0);s.push('carry');}
    }
    return {y:Y,p:P.id,v:v,s:s};
  });
}

function fmt(n,d){if(n==null||isNaN(n))return '-';return Number(n).toLocaleString('en-US',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});}
function fmtK(n){n=+n;if(Math.abs(n)>=1e6)return (n/1e6).toFixed(2).replace(/\.?0+$/,'')+'M';if(Math.abs(n)>=1e3)return (n/1e3).toFixed(n>=1e4?0:1).replace(/\.0$/,'')+'k';return String(Math.round(n*100)/100);}

function median(a){if(!a.length)return 0;a=a.slice().sort(function(x,y){return x-y;});var h=a.length>>1;return a.length%2?a[h]:(a[h-1]+a[h])/2;}

var tip=$('tip');
function showTip(e,html){tip.innerHTML=html;tip.style.display='block';var x=e.clientX+14,y=e.clientY+14,w=tip.offsetWidth,h=tip.offsetHeight;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;tip.style.left=x+'px';tip.style.top=y+'px';}
function hideTip(){tip.style.display='none';}
function niceMax(v){var raw=v/4,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;var st=f<=1?1:f<=1.5?1.5:f<=2?2:f<=2.5?2.5:f<=3?3:f<=4?4:f<=5?5:f<=6?6:f<=8?8:10;return st*p*4;}
function barChart(el,o){
  var W=Math.max(300,el.clientWidth),H=o.height||260,m={t:10,r:8,b:28,l:46};
  var iw=W-m.l-m.r,ih=H-m.t-m.b,n=o.cats.length,k=o.series.length;
  var max=o.ref||0;o.series.forEach(function(s){s.values.forEach(function(v){if(v>max)max=v;});});
  max=niceMax(max||1);
  var band=iw/n,gap=Math.min(band*0.28,14),gw=band-gap,bw=Math.max(2,(gw-(k-1)*2)/k);if(k===1)bw=Math.min(bw,38);
  var y=function(v){return m.t+ih-(v/max)*ih;};
  var svg='<svg viewBox="0 0 '+W+' '+H+'" height="'+H+'" role="img">';
  for(var i=0;i<=4;i++){var v=max*i/4,yy=y(v);svg+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--grid)"/><text x="'+(m.l-6)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="var(--ink3)">'+(o.yfmt?o.yfmt(v):fmtK(v))+'</text>';}
  var every=Math.ceil(n/(iw/34));
  o.cats.forEach(function(c,ci){
    var gx=m.l+ci*band+gap/2,grpW=k*bw+(k-1)*2,start=gx+(gw-grpW)/2;
    o.series.forEach(function(s,si){var v=s.values[ci];if(!v)return;var x=start+si*(bw+2),yt=y(v),h=m.t+ih-yt,r=Math.min(4,bw/2,h);
      svg+='<path d="M'+x+','+(m.t+ih)+'V'+(yt+r)+'Q'+x+','+yt+' '+(x+r)+','+yt+'H'+(x+bw-r)+'Q'+(x+bw)+','+yt+' '+(x+bw)+','+(yt+r)+'V'+(m.t+ih)+'Z" fill="'+s.color+'"/>';});
    if(o.flags&&o.flags[ci])svg+='<text x="'+(m.l+ci*band+band/2)+'" y="'+(m.t+8)+'" text-anchor="middle" font-size="10" fill="var(--crit)">▲</text>';
    if(ci%every===0)svg+='<text x="'+(m.l+ci*band+band/2)+'" y="'+(H-10)+'" text-anchor="middle" font-size="11" fill="var(--ink2)">'+esc(o.catShort?o.catShort[ci]:c)+'</text>';
    svg+='<rect class="hit" data-i="'+ci+'" x="'+(m.l+ci*band)+'" y="'+m.t+'" width="'+band+'" height="'+ih+'" fill="transparent"/>';
  });
  if(o.ref){var ry=y(o.ref);svg+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+ry+'" y2="'+ry+'" stroke="var(--ink3)" stroke-width="1.5" stroke-dasharray="5 4"/>';}
  svg+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+(m.t+ih)+'" y2="'+(m.t+ih)+'" stroke="var(--ink3)"/></svg>';
  el.innerHTML=svg;
  el.querySelectorAll('rect.hit').forEach(function(r){
    r.addEventListener('mousemove',function(e){r.setAttribute('fill','rgba(0,0,0,.04)');showTip(e,o.tip(+r.dataset.i));});
    r.addEventListener('mouseleave',function(){r.setAttribute('fill','transparent');hideTip();});
    r.addEventListener('click',function(e){showTip(e,o.tip(+r.dataset.i));if(o.onClick)o.onClick(+r.dataset.i);});
  });
}

/* ---------- plan vs actual ---------- */
function planYears(){var set={};S.plans.forEach(function(p){set[p.y]=1;});S.recs.forEach(function(r){set[+r.d.slice(0,4)]=1;});return Object.keys(set).map(Number).sort();}
function planFor(y,pid){return S.plans.filter(function(x){return x.y===y&&x.p===pid;})[0];}
function pIds(){return S.pProj==='all'?PROJECTS.map(function(p){return p.id;}):[S.pProj];}
function planData(y){
  var ids=pIds(),plan=[],act=[],days=[],src=[],has=false;
  for(var m=1;m<=12;m++){
    var key=y+'-'+('0'+m).slice(-2),pv=0,ss2=[];
    ids.forEach(function(id){var p=planFor(y,id);if(p){has=true;pv+=+p.v[m-1]||0;ss2.push(p.s[m-1]);}});
    var rs=S.recs.filter(function(r){return ids.indexOf(r.p)>=0&&ym(r.d)===key;});
    plan.push(pv);act.push(sum(rs,'kwh'));
    var lastDay=rs.length?Math.max.apply(null,rs.map(function(r){return +r.d.slice(8);})):0;days.push(lastDay);
    src.push(ss2.indexOf('manual')>=0?'manual':ss2.indexOf('avg')>=0?'avg':ss2.indexOf('carry')>=0?'carry':'');
  }
  return {plan:plan,act:act,days:days,src:src,has:has};
}
function pctCell(a,p){if(!p||!a)return '<td></td>';var x=a/p;return '<td class="'+(x>=1?'good':'bad')+'">'+(x>=1?'▲ ':'▼ ')+(x*100).toFixed(1)+'%</td>';}
function renderPlan(){
  var ys=planYears(),now=new Date();if(!S.pYear||ys.indexOf(S.pYear)<0)S.pYear=ys.indexOf(now.getFullYear())>=0?now.getFullYear():ys[ys.length-1];
  $('pYear').innerHTML=ys.map(function(y){return '<option value="'+y+'"'+(y===S.pYear?' selected':'')+'>'+y+'</option>';}).join('');
  $('pProj').innerHTML='<button type="button" data-v="all" class="'+(S.pProj==='all'?'on':'')+'">'+t('all')+'</button>'+PROJECTS.map(function(p){return '<button type="button" data-v="'+p.id+'" class="'+(S.pProj===p.id?'on':'')+'">'+pName(p.id)+'</button>';}).join('');
  $('pEdit').textContent=S.pEditing?t('savePlan'):t('editPlan');
  $('pEdit').disabled=S.pProj==='all'&&!S.pEditing;$('pEdit').title=S.pProj==='all'?(LANG==='lo'?'ເລືອກໂຄງການກ່ອນ':'Select a project first'):'';
  $('pGen').textContent=t('regenPlan');
  var y=S.pYear,D=planData(y),color=S.pProj==='all'?'var(--brand)':PMAP[S.pProj].color,hex=S.pProj==='all'?'#0d5c46':PMAP[S.pProj].hex;
  var sumR=function(a,i0,i1){var s=0;for(var i=i0;i<i1;i++)s+=a[i];return s;};
  var H1p=sumR(D.plan,0,6),H1a=sumR(D.act,0,6),H2p=sumR(D.plan,6,12),H2a=sumR(D.act,6,12),Yp=H1p+H2p,Ya=H1a+H2a;
  // YTD (per project): plan from its first month with actual data up to the last recorded day, current month prorated
  var ytdP=0,ytdA=0,ytdFrom=13,ytdTo=0,ytdDay=0;
  pIds().forEach(function(id){var pl=planFor(y,id);if(!pl)return;var f=0,l=0,ld=0;
    for(var m=1;m<=12;m++){var rs=S.recs.filter(function(r){return r.p===id&&ym(r.d)===y+'-'+('0'+m).slice(-2);});if(sum(rs,'kwh')>0){if(!f)f=m;l=m;ld=Math.max.apply(null,rs.map(function(r){return +r.d.slice(8);}));ytdA+=sum(rs,'kwh');}}
    if(!f)return;ytdFrom=Math.min(ytdFrom,f);if(l>ytdTo||(l===ytdTo&&ld>ytdDay)){ytdTo=l;ytdDay=ld;}
    for(var i=f;i<=l;i++){var dim=new Date(y,i,0).getDate();ytdP+=(i<l||ld>=dim)?pl.v[i-1]:pl.v[i-1]*ld/dim;}});
  var lastM=ytdTo;
  var chip=function(l,a,p,sub){var x=p?a/p:0;return '<div class="pchip"><div class="l">'+l+'</div><div class="v num" style="color:'+(p&&a?(x>=1?'#1a7f37':'var(--crit)'):'inherit')+'">'+(p&&a?(x>=1?'▲ ':'▼ ')+(x*100).toFixed(1)+'%':'-')+'</div><div class="s num">'+gwh(a)+' / '+gwh(p)+' GWh'+(sub?'<br>'+sub:'')+'</div></div>';};
  $('pChips').innerHTML=chip(t('h1'),H1a,H1p)+chip(t('h2'),H2a,H2p)+chip(t('year'),Ya,Yp)+chip(t('ytd'),ytdA,ytdP,lastM?t('ytdSub',MONS[LANG][ytdFrom]+' – '+ytdDay+' '+MONS[LANG][lastM]):'');
  legend($('planLegend'),[{name:t('plan'),color:PLAN_COLOR},{name:t('actual'),color:color}]);
  barChart($('chPlan'),{cats:MONS.en.slice(1),catShort:MONS[LANG].slice(1).map(function(x){return LANG==='lo'?x.slice(0,4):x;}),height:260,
    series:[{color:PLAN_COLOR,values:D.plan},{color:color,values:D.act}],yfmt:function(v){return (v/1e6).toFixed(2);},
    tip:function(i){var h='<b>'+MON[LANG][i+1]+' '+y+'</b>'+tipRow(PLAN_COLOR,t('plan'),gwh(D.plan[i])+' GWh')+tipRow(hex,t('actual'),gwh(D.act[i])+' GWh');if(D.plan[i]&&D.act[i])h+='<div class="row"><span>'+t('percentage')+'</span><span class="num">'+(D.act[i]/D.plan[i]*100).toFixed(1)+'%</span></div>';return h;}});
  // table (image format)
  var tag=function(s){return s==='avg'?'<span class="srcTag">ⓐ</span>':s==='carry'?'<span class="srcTag">ⓒ</span>':s==='manual'?'<span class="srcTag">ⓜ</span>':'';};
  var editing=S.pEditing&&S.pProj!=='all';
  var row=function(i,cls){var a=D.act[i],p=D.plan[i],dim=new Date(y,i+1,0).getDate(),part=a&&D.days[i]<dim;
    return '<tr class="'+(cls||'')+'"><td class="m">'+MONS[LANG][i+1]+'</td><td class="num">'+(editing?'<input type="number" step="0.001" min="0" data-m="'+i+'" value="'+gwh(p)+'">':(p?gwh(p):'')+tag(D.src[i]))+'</td><td class="num">'+(a?gwh(a)+(part?' *':''):'')+'</td>'+pctCell(a,p)+'<td class="num">'+(a&&p?((a-p)>=0?'+':'')+gwh(a-p):'')+'</td></tr>';};
  var subRow=function(lbl,a,p,cls){return '<tr class="'+cls+'"><td class="m">'+lbl+'</td><td class="num">'+gwh(p)+'</td><td class="num">'+(a?gwh(a):'')+'</td>'+pctCell(a,p)+'<td class="num">'+(a&&p?((a-p)>=0?'+':'')+gwh(a-p):'')+'</td></tr>';};
  var body='';for(var j=0;j<6;j++)body+=row(j);body+=subRow(t('h1'),H1a,H1p,'sub');for(j=6;j<12;j++)body+=row(j,'h2row');body+=subRow(t('h2'),H2a,H2p,'sub')+subRow(t('year'),Ya,Yp,'tot');
  $('planTable').innerHTML='<thead><tr class="ttl"><th colspan="5">'+esc(t('planDecl',y))+(S.pProj!=='all'?' · '+esc(pName(S.pProj)):' · '+t('allProjects'))+'</th></tr><tr><th rowspan="2">'+t('month')+'</th><th>'+t('plan')+'</th><th>'+t('actual')+'</th><th>'+t('percentage')+'</th><th>'+t('diff')+'</th></tr><tr><th>(GWh)</th><th>(GWh)</th><th>(%)</th><th>(GWh)</th></tr></thead><tbody>'+body+'</tbody>';
  // notes
  var notes=[];if(!D.has)notes.push(t('noPlan'));
  pIds().forEach(function(id){var p=planFor(y,id);if(!p)return;var kinds={};p.s.forEach(function(s){kinds[s]=1;});
    var txt=kinds.given?t('srcGiven'):kinds.scaled?t('srcScaled',PMAP[id].mw):(kinds.avg||kinds.carry)?t('srcAuto',y-1):kinds.manual?t('srcManual'):'';
    if(kinds.manual&&!kinds.given)txt+=(txt?' · ':'')+t('srcManual');notes.push('<b>'+pName(id)+'</b>: '+txt);});
  var partM=D.act.map(function(a,i){return a&&D.days[i]<new Date(y,i+1,0).getDate()?i:-1;}).filter(function(i){return i>=0;});
  if(partM.length)notes.push(partM.map(function(i){return t('partial',D.days[i]+' '+MONS[LANG][i+1]);}).join(' · '));
  if(D.src.some(function(s){return s;}))notes.push(t('srcLegend'));
  if(pIds().some(function(id){return SHARED.indexOf(id)>=0;}))notes.push('🔗 '+t('planShared'));
  $('pNote').innerHTML=notes.join('<br>');
}

function fillShared(){

  var total=ex?((rT&&rT.m)||(rP&&rP.m)||((rT?rT.kwh:0)+(rP?rP.kwh:0))):'';
  $('edKwh').value=total===''?'':Math.round(total*100)/100;
  $('onT').checked=!ex||!total||!!(rT&&rT.kwh>0);$('onP').checked=!ex||!total||!!(rP&&rP.kwh>0);
  $('edIrr').value=ex&&ex.irr!=null?ex.irr:'';$('edNoteT').value=rT?rT.note:'';$('edNoteP').value=rP?rP.note:'';
  $('edRate').value=String(ex&&ex.rate?ex.rate:DEFAULT_RATE);if(!$('edRate').value)$('edRate').value=String(DEFAULT_RATE);
  $('edTitle').textContent=ex?t('edEdit'):t('edAdd');$('edInfo').textContent=ex?t('editingShared',usDate(d)):t('newShared');
  $('edDel').style.visibility=ex?'visible':'hidden';calc();
}
function fillEditor(first){
  setSharedUI(isShared());
  if(isShared()){fillShared();return;}
  if(edStart&&edStart.shared)edStart=null;
  var r=byKey()[$('edProj').value+'|'+$('edDate').value];
  if(first)edStart=r||null;
  if(!first&&!r&&edStart){edOrig=null;$('edInfo').textContent=t('moving',pName(edStart.p),usDate(edStart.d),pName($('edProj').value),usDate($('edDate').value));$('edTitle').textContent=t('edMove');$('edDel').style.visibility='hidden';calc();return;}
  edOrig=r||null;if(r)edStart=r;
  $('edInfo').textContent=r?t('editing',pName(r.p),usDate(r.d)):'';
  $('edTitle').textContent=r?t('edEdit'):t('edAdd');
  $('edKwh').value=r?r.kwh:'';$('edIrr').value=r&&r.irr!=null?r.irr:'';$('edNote').value=r?r.note:'';
  $('edRate').value=String(r&&r.rate?r.rate:DEFAULT_RATE);if(!$('edRate').value)$('edRate').value=String(DEFAULT_RATE);
  $('edDel').style.visibility=r?'visible':'hidden';calc();
}
function calc(){var k=+$('edKwh').value||0;
  if(isShared()){var sp=splitShared(k,{Thabok:$('onT').checked,Phonsavanh:$('onP').checked});
    $('edCalc').innerHTML=t('splitCalc',fmt(sp.Thabok,2),k?(sp.Thabok/k*100).toFixed(2)+'%':'-',fmt(sp.Phonsavanh,2),k?(sp.Phonsavanh/k*100).toFixed(2)+'%':'-',fmt(k*(+$('edRate').value),2));return;}
  var p=PMAP[$('edProj').value];$('edCalc').innerHTML=t('calc',fmt(k*(+$('edRate').value),2),pct(k/(p.pfBase*SUN_HOURS)));}
['edKwh','edRate'].forEach(function(id){$(id).addEventListener('input',calc);});
['onT','onP'].forEach(function(id){$(id).addEventListener('change',calc);});
['edProj','edDate'].forEach(function(id){$(id).addEventListener('change',function(){fillEditor(false);});});
$('edCancel').onclick=function(){$('editor').hidden=true;};
function busy(b){$('edForm').classList.toggle('loading',b);}
$('edForm').onsubmit=function(e){
  e.preventDefault();
  if(isShared()){
    var o={d:$('edDate').value,total:$('edKwh').value===''?0:+$('edKwh').value,irr:$('edIrr').value===''?null:+$('edIrr').value,rate:+$('edRate').value,
      on:{Thabok:$('onT').checked,Phonsavanh:$('onP').checked},notes:{Thabok:$('edNoteT').value.trim(),Phonsavanh:$('edNoteP').value.trim()}};
    if(!o.d){$('edErr').textContent=t('errDate');return;}
    if(!(o.total>0)&&!o.notes.Thabok&&!o.notes.Phonsavanh){$('edErr').textContent=t('errEmpty');return;}
    if(o.total>0&&!o.on.Thabok&&!o.on.Phonsavanh){$('edErr').textContent=t('errOnline');return;}
    if(o.total>4.5*1000*24){$('edErr').textContent=t('errHigh');return;}
    busy(true);
    API.saveShared(S.pw,o).then(function(){$('editor').hidden=true;toast(t('saved'));S.month=ym(o.d);S.tblMonth=ym(o.d);if(SHARED.indexOf(S.tblProj)<0)S.tblProj='Thabok';return reload();})
      .catch(function(err){$('edErr').textContent=String(err);}).then(function(){busy(false);});
    return;
  }
  var rec={p:$('edProj').value,d:$('edDate').value,kwh:$('edKwh').value===''?0:+$('edKwh').value,irr:$('edIrr').value===''?null:+$('edIrr').value,note:$('edNote').value.trim(),rate:+$('edRate').value};
  if(!rec.d){$('edErr').textContent=t('errDate');return;}
  if(!(rec.kwh>0)&&!rec.note){$('edErr').textContent=t('errEmpty');return;}
  if(rec.kwh>PMAP[rec.p].mw*1000*24){$('edErr').textContent=t('errHigh');return;}
  var moveFrom=(!edOrig&&edStart&&(edStart.p!==rec.p||edStart.d!==rec.d))?edStart:null;
  busy(true);
  API.save(S.pw,rec).then(function(){return moveFrom?API.del(S.pw,moveFrom.p,moveFrom.d):true;}).then(function(){$('editor').hidden=true;toast(moveFrom?t('movedSaved'):t('saved'));S.month=ym(rec.d);S.tblMonth=ym(rec.d);S.tblProj=rec.p;return reload();})
    .catch(function(err){$('edErr').textContent=String(err);}).then(function(){busy(false);});
};
$('edDel').onclick=function(){
  if(edOrig&&edOrig.shared){if(!confirm(t('confirmDelShared',usDate(edOrig.d))))return;busy(true);
    API.delShared(S.pw,edOrig.d).then(function(){$('editor').hidden=true;toast(t('deleted'));return reload();}).catch(function(err){$('edErr').textContent=String(err);}).then(function(){busy(false);});return;}
  if(!edOrig||!confirm(t('confirmDel',pName(edOrig.p),usDate(edOrig.d))))return;busy(true);
  API.del(S.pw,edOrig.p,edOrig.d).then(function(){$('editor').hidden=true;toast(t('deleted'));return reload();}).catch(function(err){$('edErr').textContent=String(err);}).then(function(){busy(false);});};

/* ================= MODE / LANG / FILTERS ================= */
function setMode(staff,pw){S.staff=staff;S.pw=pw||'';S.pEditing=false;document.body.classList.toggle('is-staff',staff);$('gate').hidden=true;ss('solarMode',staff?'staff':'viewer');ss('solarPw',staff?S.pw:'');render();}
$('gViewer').onclick=function(){setMode(false);};
$('gStaff').onclick=function(){$('gateBtns').hidden=true;$('pwBox').hidden=false;$('pwErr').textContent='';$('pw').value='';$('pw').focus();};
$('pwBack').onclick=function(){$('gateBtns').hidden=false;$('pwBox').hidden=true;};
function tryPw(){var v=$('pw').value;$('pwGo').disabled=true;API.checkPw(v).then(function(ok){if(ok)setMode(true,v);else $('pwErr').textContent=t('wrongPw');}).catch(function(e){$('pwErr').textContent=String(e);}).then(function(){$('pwGo').disabled=false;});}
$('pwGo').onclick=tryPw;$('pw').addEventListener('keydown',function(e){if(e.key==='Enter')tryPw();});
$('btnMode').onclick=function(){$('gateBtns').hidden=false;$('pwBox').hidden=true;$('gate').hidden=false;};
$('btnAdd').onclick=function(){openEditor(S.proj==='all'?S.tblProj:S.proj);};
function setLang(l){LANG=l;try{localStorage.setItem('solarLang',l);}catch(e){}render();}
['langSeg','gateLang'].forEach(function(id){$(id).addEventListener('click',function(e){var b=e.target.closest('button');if(b)setLang(b.dataset.v);});});
$('fMonth').onchange=function(){S.month=this.value;S.tblMonth=this.value;render();};
$('fProj').onchange=function(){S.proj=this.value;if(S.proj!=='all'){S.tblProj=S.proj;S.pProj=S.proj;}render();};
$('tblMonth').onchange=function(){S.tblMonth=this.value;renderTable();};
$('tblProj').addEventListener('click',function(e){var b=e.target.closest('button');if(b){S.tblProj=b.dataset.v;renderFilters();renderTable();}});
$('evScope').addEventListener('click',function(e){var b=e.target.closest('button');if(b){S.evScope=b.dataset.v;renderEvents();}});
$('btnPrint').onclick=function(){window.print();};
$('btnCsv').onclick=function(){
  var p=PMAP[S.tblProj],m=S.tblMonth,K=byKey(),lines=['Date,Generation (kWh),Revenue (USD),Plant Factor,Irradiance (kWh/m2),Note'];
  for(var d=1;d<=daysIn(m);d++){var iso=m+'-'+('0'+d).slice(-2),r=K[p.id+'|'+iso];lines.push([usDate(iso),r?r.kwh:'',r?rev(r).toFixed(3):'',r?pf(r).toFixed(4):'',r&&r.irr!=null?r.irr:'','"'+(r?r.note:'').replace(/"/g,'""')+'"'].join(','));}
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+lines.join('\n')],{type:'text/csv'}));a.download=p.id+'_Generation_'+m+'.csv';document.body.appendChild(a);a.click();a.remove();
};
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){renderDaily();renderRevenue();renderMonthly();renderPlan();},150);});

/* ================= BOOT ================= */
function reload(){$('loadBadge').style.display='';return API.load().then(function(d){$('loadBadge').style.display='none';
  S.recs=(d.records||[]).map(function(r){return {p:r.p,d:String(r.d).slice(0,10),kwh:+r.kwh||0,irr:(r.irr===''||r.irr==null)?null:+r.irr,note:r.note||'',rate:+r.rate||DEFAULT_RATE,m:+r.m||0};}).filter(function(r){return PMAP[r.p];});
  S.plans=(d.plans||[]).map(function(p){return {y:+p.y,p:p.p,v:p.v.map(Number),s:p.s||[]};});render();});}
applyStatic();renderMode();
if(!REMOTE)$('srcBadge').style.display='';
reload().then(function(){var m=ss('solarMode');if(m==='viewer')setMode(false);else if(m==='staff'&&ss('solarPw')){var pw=ss('solarPw');API.checkPw(pw).then(function(ok){if(ok)setMode(true,pw);});}})
.catch(function(e){$('loadBadge').style.display='none';$('kpis').innerHTML='<div class="kpi" style="grid-column:1/-1;color:var(--crit)">'+esc(t('loadFail',e))+'</div>';});
})();
</script>
